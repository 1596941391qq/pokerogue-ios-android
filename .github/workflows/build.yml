name: Build Android & iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Published APKs are signed with the maintainer's key so they install over older versions.
      # Add it as the PRS_KEYSTORE_B64 secret (base64 of debug.keystore) to get update-compatible CI builds;
      # without it (forks, pull requests) a throwaway key is used, which is fine for checking the build.
      - name: Prepare signing key
        env:
          PRS_KEYSTORE_B64: ${{ secrets.PRS_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$PRS_KEYSTORE_B64" ]; then
            echo "$PRS_KEYSTORE_B64" | base64 -d > "$KS"
          else
            keytool -genkeypair -keystore "$KS" -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "PRS_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pokerogue-android
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: ios/build-ipa.sh "$RUNNER_TEMP/PokeRogue.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: pokerogue-ios
          path: ${{ runner.temp }}/PokeRogue.ipa
          compression-level: 0
