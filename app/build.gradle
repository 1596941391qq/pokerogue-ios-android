plugins {
    id 'com.android.application'
}
android {
    namespace 'com.mengnieyu.helloworld'
    compileSdk 34

    defaultConfig {
        applicationId "com.mengnieyu.helloworld"
        minSdk 24
        targetSdk 33
        versionCode 7
        versionName "1.12.2.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Every published APK is signed with the maintainer's Android debug key
    // (SHA-256 6F:D8:A8:D6:13:F5:CD:26:...:EC:94:B0:35), so new releases install over old ones.
    // Locally it is ~/.android/debug.keystore; CI restores it from a repository secret.
    signingConfigs {
        release {
            storeFile file(System.getenv("PRS_KEYSTORE") ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv("PRS_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("PRS_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("PRS_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '23.0.7599858'
    buildToolsVersion '34.0.0'
}

dependencies {
//    implementation 'com.android.tools.build:gradle:4.1.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

}